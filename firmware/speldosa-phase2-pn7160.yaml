# Speldosa phase 2: carrier v1.0 with XIAO ESP32-C6 and an Elechouse PN7160 module in J3.
# Pins: the phase 2 carrier v1.0 pinout (XIAO D0 LED, D1 buzzer, D2 NFC IRQ, D3 NFC VEN, D4/D5 I2C).
substitutions:
  board_id: phase2-pn7160
  i2c_sda: GPIO22
  i2c_scl: GPIO23
  nfc_irq_pin: GPIO2
  nfc_ven_pin: GPIO21
  led_pin: GPIO0
  led_count: "1"
  buzzer_pin: GPIO1
  external_antenna_default: RESTORE_DEFAULT_OFF   # ceramic until switched in HA
  lift_delay_default: "1.5"

packages:
  core: !include packages/core.yaml
  platform: !include packages/platform-esp32c6.yaml
  nfc: !include packages/nfc-pn7160.yaml
  buzzer: !include packages/buzzer-active.yaml
  antenna: !include packages/antenna-xiao-c6.yaml
