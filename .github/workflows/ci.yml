name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv venv -p 3.14 && uv pip install -r requirements-test.txt
      - run: uv run --no-project python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
      # The committed bundle must match the source.
      - run: git diff --exit-code -- ../custom_components/speldosa/frontend/speldosa-panel.js

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [speldosa-phase2-pn532, speldosa-phase2-pn7160, speldosa-phase3, speldosa-phase1-d1mini]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/ESPHOME_VERSION') }}
      - run: firmware/build.sh compile ${{ matrix.board }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.board }}
          path: dist/
